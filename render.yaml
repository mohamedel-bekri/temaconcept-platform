services:
  - type: web
    name: temaconcept-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/site
    envVars:
      - key: APP_NAME
        value: TEMACONCEPT
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://temaconcept-api.onrender.com
      - key: FRONTEND_URL
        value: https://temaconcept-web.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: CHATBOT_MODE
        value: auto

  - type: web
    name: temaconcept-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://temaconcept-api.onrender.com
